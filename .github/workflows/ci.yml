name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4 and tshark
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 tshark
      - name: Run Lua unit tests
        run: lua5.4 test_wire.lua
      - name: Run tshark fixture tests
        run: python3 tests/test_tshark.py
